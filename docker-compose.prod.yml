# Build the production image from this checkout and run it inside the release
# bundle — for development and diagnosis, not for installation. Operators use
# the downloadable bundle (docs/INSTALL.md).
#
#   cp deploy/example.env deploy/.env   # fill it in; set STOKY_VERSION=source
#   docker compose -f deploy/docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file is an override, not a second production definition. The hardening
# (capabilities, limits, read-only app, internal network, file-provider Traefik
# with no Docker socket, security headers) lives once, in deploy/. Until
# 2026-10 it was restated here and had already drifted: an older Traefik that
# discovered routes through a mounted Docker socket.
#
# Paths are relative to deploy/, the first file's directory, which is also
# where Compose reads `.env` from.

# Not `stoky-release`: a source build on a host that also runs the release must
# not adopt its volumes.
name: stoky-source

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    # Never pull: the tag names ghcr.io, and what is wanted is this checkout.
    pull_policy: build
