# Hardening applied to every service:
#   no-new-privileges  a compromised process cannot gain rights via setuid
#   cap_drop: ALL      capabilities are added back only where actually needed
#   restart: unless-stopped   a self-hosted box reboots and must come back up
#   resource limits    one runaway service cannot take the whole host down
#
# The app additionally runs read-only, with writes confined to the uploads
# volume and a tmpfs. Postgres and Valkey need a writable data directory, so
# they keep a normal filesystem and are isolated on an internal network with no
# published ports instead.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Postgres needs these to start as its own user and manage its data dir.
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stoky
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No exposed ports - internal only

  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 256m
    volumes:
      - valkey_data:/data
    networks:
      - stoky
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No exposed ports - internal only

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      # Next.js writes its cache here; keeping it in tmpfs means the rest of the
      # filesystem can stay read-only.
      - /tmp
      - /app/.next/cache
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - VALKEY_URL=${VALKEY_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    volumes:
      - uploads:/app/uploads
    # The one service that had no healthcheck, though it is the one that can
    # wedge: a Next process that has stopped answering is still "running", so
    # `restart: unless-stopped` never fires without this. `/api/health` also
    # checks that db and cache are reachable, because an app that answers HTTP
    # but cannot sign anybody in is not healthy in any sense that matters.
    #
    # `wget` rather than `curl`: the production image is `node:24-alpine`,
    # where BusyBox provides wget and curl is not installed. `start_period`
    # covers the first boot, when Prisma is still connecting.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - stoky
      - traefik
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stoky.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.stoky.entrypoints=websecure"
      - "traefik.http.routers.stoky.tls.certresolver=letsencrypt"
      - "traefik.http.services.stoky.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.stoky-security.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.stoky-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.stoky-security.headers.stsPreload=true"
      - "traefik.http.middlewares.stoky-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.stoky-security.headers.frameDeny=true"
      - "traefik.http.routers.stoky.middlewares=stoky-security"

  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Binding 80/443 as a non-root user.
    cap_add: [NET_BIND_SERVICE]
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only, but still the largest privilege granted anywhere in this
      # file: read access to the Docker socket is effectively root on the host.
      # It is here because Traefik's Docker provider discovers routes through
      # it. If that trade is not acceptable, put a socket proxy in front of it
      # and expose only the container-list endpoint, or swap the provider for a
      # static file.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik

volumes:
  postgres_data:
  valkey_data:
  uploads:
  letsencrypt:

networks:
  stoky:
    driver: bridge
    internal: true
  traefik:
    driver: bridge
