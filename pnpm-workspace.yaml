# pnpm settings.
#
# pnpm 11 no longer reads the `pnpm` field in package.json — it warns and
# ignores it. These settings were moved here from package.json during the
# upgrade to pnpm 11.19.0. Leaving them behind would have silently dropped the
# security overrides below and let four transitive advisories return.
#
# See https://pnpm.io/settings

# Transitive packages with no fixed parent release. Each override is scoped to
# the single parent that pulls it, so no unrelated dependant is forced onto a
# different version, and every bump stays within the same major.
# See docs/STATUS.md § Dependency security.
overrides:
  "@parcel/watcher>picomatch": ^4.0.5
  "recharts>lodash": ^4.18.1
  "@prisma/config>effect": ^3.22.1
  "c12>defu": ^6.1.7
  "postcss>nanoid": ^3.3.18
  # The one entry that crosses a major (7 → 8), because that is where the fix
  # is: GHSA-ggr8-5vv4-36mx has no 7.x release. Verified against @prisma/config
  # by `prisma generate`, `migrate status` and the integration suite before it
  # was kept — see docs/superpowers/plans/2026-08-17-e2e-isolation-and-
  # production-build.md Task 1.
  "@prisma/config>deepmerge-ts": ^8.0.0

# Packages allowed to run install scripts. pnpm blocks them by default, which is
# the right default — each entry here is something that does not work without
# its build step:
#
#   argon2, @swc/core, @parcel/watcher, sharp  compile native bindings
#   prisma, @prisma/client, @prisma/engines    generate the client and fetch engines
#   tesseract.js                               fetches its OCR worker assets
#   @biomejs/biome                             downloads its platform binary
#
# Replaces `onlyBuiltDependencies`, which pnpm 11 renamed to `allowBuilds`.
allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  argon2: true
  prisma: true
  sharp: true
  tesseract.js: true

# When `pnpm audit` turns CI red on an advisory that has no fixed release to
# move to, the exception goes here — scoped to the one CVE, with its reasoning
# — rather than lowering --audit-level in the workflow or letting master stay
# red until upstream ships. Same philosophy as `overrides` above: narrow,
# explained, and reviewed like code. Remove each entry the moment a fixed
# release exists.
#
# auditConfig:
#   ignoreCves:
#     - CVE-XXXX-XXXXX  # <parent>package>: why it does not apply here, and the date added
