name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      # --trust-lockfile skips re-verifying each entry against pnpm's
      # minimumReleaseAge policy. That check is for resolution time; CI installs
      # a committed, reviewed lockfile, which is the documented case for this
      # flag. Without it, CI fails for a day whenever a dependency publishes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        
      - name: Run lint
        run: pnpm lint
        
      - name: Run typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run tests
        run: pnpm test:unit && pnpm test:components && pnpm test:integration
        env:
          NEXTAUTH_SECRET: test-secret

  build:
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: stoky:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
