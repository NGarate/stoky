name: CI

# Trunk-based: master is the only branch, so every push to it is a release
# candidate. There is no pull-request gate to lean on — this pipeline is the
# gate, and it has to be trustworthy enough that a red run means something.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Superseded runs are wasted work on a trunk. Cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

# Every job that runs tests is held to ten minutes. That is a product decision,
# not a runner constraint: verification that takes longer stops being run, and a
# suite nobody runs still has to be maintained while telling nobody anything.
# The jobs run concurrently, so ten minutes is also the whole test phase.
#
# Where a tool has its own ceiling, the job's is set just above it, so the tool
# fails first and names what it was doing. A runner that kills the job produces
# no report, no trace, and nothing anyone can act on.
#
# Actions are pinned by commit SHA rather than tag: a tag can be moved to point
# at different code, a SHA cannot. The comment records the human-readable version.
env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --------------------------------------------------------------- quality --
  quality:
    name: Lint, types, contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # checkout persists the workflow token into .git/config for the rest of
      # the job by default. Nothing in this pipeline pushes, so no step needs
      # it — and a credential nothing needs is only ever available to an
      # attacker in a compromised dependency.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The pipeline linting itself. A workflow bug has no test to fail — it
      # surfaces as a red run on the trunk after push — so it gets a gate that
      # runs before anything else does. Same script runs locally.
      - name: Lint the pipeline itself
        run: bash scripts/check-ci.sh

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Pinned via .bun-version rather than left to float: unpinned, this
      # resolves to whatever Bun released last night, which can turn the trunk
      # red with no commit to blame and no revert that fixes it. The file is
      # the single place a Bun upgrade happens, deliberately.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # --trust-lockfile skips re-verifying each entry against minimumReleaseAge.
      # That check belongs to resolution time; CI installs a committed, reviewed
      # lockfile, and without it CI breaks for a day whenever a dependency publishes.
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck

      # Security, correctness, performance and accessibility rules that neither
      # oxlint nor tsc looks for. Gates on errors only: the score is a number
      # nobody has agreed to, and a gate on one either blocks every commit or
      # gets raised until it means nothing. `--no-telemetry` because this
      # project does not send its source health to a third party to satisfy a
      # gate.
      - name: React doctor
        run: pnpm check:react

      - name: WCAG AAA contrast
        run: pnpm check:contrast

      # Three manual audits missed a dead route each, always because the call
      # site used a template literal rather than a string. This does not.
      - name: Internal links
        run: pnpm check:links

  # ----------------------------------------------------------------- tests --
  test:
    name: Unit, component, integration
    runs-on: ubuntu-latest
    # Measured at 52s for all three suites. Ten is the shared budget, not an
    # estimate of this job.
    timeout-minutes: 10
    # Service containers rather than docker compose inside the runner: the
    # runner owns health and teardown, and a hung compose cannot wedge the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoky
          POSTGRES_PASSWORD: stoky_ci
          POSTGRES_DB: stoky_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stoky -d stoky_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      cache:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://stoky:stoky_ci@localhost:5432/stoky_test?schema=public
      VALKEY_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm db:generate

      # Applying migrations to an empty database is itself a test. A migration
      # that only works against an already-prepared database is one that fails
      # on someone's first install — exactly what happened with pg_trgm.
      - name: Apply migrations to a fresh database
        run: pnpm prisma migrate deploy

      - run: pnpm test:unit
      - run: pnpm test:components
      - run: pnpm test:integration:only

  # ------------------------------------------------------------------- e2e --
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Ten, like every other test job. Playwright's own `globalTimeout` is nine,
    # which leaves one for install, migrate and seed and means Playwright fails
    # first and names the test it was sitting on — a job killed by the runner
    # produces no report and no trace.
    #
    # 55 was the previous value and it was wrong in the other direction: the
    # budget belongs to the suite, and a ceiling set above what the suite should
    # ever take enforces nothing.
    timeout-minutes: 10
    # Playwright's own image, which carries the browsers *and* their system
    # libraries already installed.
    #
    # `playwright install --with-deps` used to run here and cost **136
    # seconds every run** — measured from the step timings of run
    # 31569653824, with the browser cache hitting, so none of it was
    # downloading browsers. It was apt. All 50 packages Chromium and Firefox
    # need are already on `ubuntu-latest` and reported "already the newest
    # version"; the time went entirely on WebKit's, which pull **181 new
    # packages, 114 MB to fetch and 364 MB unpacked** — the GStreamer and
    # libav multimedia stack. Unpacking that, not fetching it, is the cost,
    # so caching the archives would not have helped.
    #
    # Dropping `--with-deps` instead was not open: the tree is not only
    # codecs. `libwoff1`, `libharfbuzz-icu0`, `libhyphen0`, `libgles2` and
    # `libgstreamer-plugins-base1.0-0` are linked by the WebKit binary, and
    # without them it does not start — and WebKit is not decoration here, it
    # is the engine `Mobile Safari` runs the layout specs on, which exist
    # because UI-5 and UI-6 were both WebKit-at-phone-width defects.
    #
    # So the work is skipped rather than made faster. The image is pinned to
    # the version below and asserted against `package.json` in the first
    # step, because browsers that do not match the driver fail in a way that
    # reads as a broken test rather than a stale tag.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoky
          POSTGRES_PASSWORD: stoky_ci
          POSTGRES_DB: stoky
        options: >-
          --health-cmd "pg_isready -U stoky -d stoky"
          --health-interval 5s --health-timeout 5s --health-retries 10
      cache:
        image: valkey/valkey:8-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # `postgres` and `cache`, not `localhost`: a job that runs in a container
      # sits on a user-defined network with the services, where each answers to
      # its own label. `localhost` inside the container is the container. The
      # published ports the other jobs rely on are gone for the same reason —
      # nothing here reaches the services through the host.
      DATABASE_URL: postgresql://stoky:stoky_ci@postgres:5432/stoky?schema=public
      VALKEY_URL: redis://cache:6379
      NEXTAUTH_SECRET: ci-only-not-a-real-secret
      # Still localhost: this is the dev server Playwright starts inside this
      # same container, not a service beside it.
      NEXTAUTH_URL: http://localhost:3000
      # Kept beside the image tag it has to agree with.
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The image ships browsers, not a general toolchain, and it has no
      # `unzip` — which setup-bun needs, because Bun is released as a .zip.
      # Without it the job died at "Unable to locate executable file: unzip"
      # before installing anything.
      #
      # Bun is not optional here: `prisma.config.ts` seeds through
      # `bun run prisma/seed.ts`, and the seed is what the browser suite reads.
      # One package, a couple of seconds, against the 136 the image removes.
      - name: unzip, which setup-bun needs and the image does not ship
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      # argon2 and sharp both resolve to prebuilt binaries on linux-x64
      # (argon2 through its `prebuilds/` directory, sharp through
      # `@img/sharp-linux-x64`), so nothing here compiles and the image needs
      # no build toolchain.
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm db:generate
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed

      # The browsers come from the image, so the one thing that can go wrong is
      # the image and the driver disagreeing about which browsers those are.
      # Left to itself that surfaces as "Executable doesn't exist at
      # /ms-playwright/chromium-####" in the middle of a test run, which reads
      # like a broken suite. Said plainly here instead, before anything runs.
      - name: The image and the package must agree on Playwright
        run: |
          PKG="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          if [ "$PKG" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is ${PKG}, but this job runs in mcr.microsoft.com/playwright:v${PLAYWRIGHT_IMAGE_VERSION}-noble. Bump the container image and PLAYWRIGHT_IMAGE_VERSION in .github/workflows/ci.yml to ${PKG}, or the browsers will not be the ones this driver expects."
            exit 1
          fi
          echo "Playwright ${PKG}, browsers from the image at ${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}."

      # `--project` is not narrowed here: the projects that skip the tier sweeps
      # do so in playwright.config.ts, so CI and a local run execute the same
      # matrix. A flag would let the two drift.
      - run: pnpm exec playwright test
        env:
          PLAYWRIGHT_PORT: "3000"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------- audit --
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --trust-lockfile

      # Dependabot's automatic pull requests are off, because they open branches
      # and this repository is trunk-only. Its alerts stay on for visibility, and
      # this job is what actually blocks a vulnerable dependency tree.
      - name: pnpm audit
        run: pnpm audit --audit-level moderate

  # ---------------------------------------------------------------- changes --
  # Whether this push touched anything that can reach the image. A docs-only
  # push rebuilds a byte-identical image for seven billed minutes; skipping it
  # is free. The answer is computed from an explicit diff rather than
  # workflow-level paths-ignore, because paths-ignore would skip the *tests*
  # too, and master stays verified on every push.
  #
  # Every unresolvable case — force push, first push, manual dispatch — says
  # "build". The expensive mistake here is a skipped image someone needed,
  # not a spare build.
  changes:
    name: What this push touched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The whole history, so the before-commit is already here and the
          # diff needs no network call. The first version of this job fetched
          # it instead and failed on a private repository the moment the
          # checkouts stopped persisting a token: `git fetch` had no
          # credentials, asked for a username, and got "No such device or
          # address". The fallback below turned that into "build", so nothing
          # shipped wrongly — but the gate skipped nothing at all, which is a
          # silent no-op rather than a failure. 291 commits is 3.9 MB and
          # about a second; not fetching is worth more than that.
          fetch-depth: 0
      - name: Diff against the previous head
        id: diff
        # Through the environment, never interpolated into the script: an
        # expression pasted into shell text is how a workflow gets an
        # injection, and this one is attacker-influencable in the general case.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Empty on workflow_dispatch; all zeros on history rewrites; absent
          # from the clone if the history was rewritten under it. All three
          # mean "cannot know", and "cannot know" means build.
          if [ -z "$BEFORE" ] || printf '%s' "$BEFORE" | grep -qE '^0+$' \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any changed file that is not documentation reaches the image.
          if git diff --name-only "$BEFORE" HEAD | grep -qvE '^(docs/|.*\.md$)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------ image-build --
  # Runs alongside the test jobs, not after them: the build takes six minutes
  # and used to start only when the slowest test finished, which put fifteen
  # minutes between a push and its image. Nothing here publishes — a failing
  # test run can waste a build, but it can never ship one. image-publish below
  # is what waits for green.
  #
  # The trade-off: on a red run these minutes are spent for nothing, and on a
  # private repository they are billed. Accepted, because the runs a person
  # actually waits on are the green ones. To revert, move this job's steps
  # back behind `needs: [quality, test, e2e, audit]`.
  image-build:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # A skipped image-build cascades: image-publish needs it, and a needed
    # skip skips the dependant unless it opts into always(), which it must
    # not — that opt-in is how a gate gets silently stepped around.
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      security-events: write
      # `codeql-action/upload-sarif` also GETs the workflow run to annotate the
      # upload, and that call needs `actions: read`. Without it every image job
      # failed at "Upload scan results" with "Resource not accessible by
      # integration" — after the build, the scan and the push had all
      # succeeded, so the pipeline reported failure while shipping the image.
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Built and loaded locally first so it is scanned before anyone can pull
      # it. Publishing an image and scanning it afterwards is the wrong order.
      # cache-to here is what makes image-publish cheap: it rebuilds this same
      # commit from these layers.
      - name: Build for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          load: true
          tags: stoky:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The SARIF pair below is reporting, not enforcement — the gate that
      # fails the build on findings is the separate Trivy step underneath, and
      # it runs unconditionally. These two run only where GitHub will accept
      # the upload: code scanning on a **private** repository needs Advanced
      # Security, and without it the API answers 403 "Code scanning is not
      # enabled" — which kept this job red for days while the build, the scan
      # gate and the push all succeeded. If this repository goes public, the
      # condition becomes true and the Security tab lights up on its own; a
      # private repository that gains Advanced Security should drop the
      # condition instead.
      - name: Scan image
        if: github.event.repository.private == false
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: stoky:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        if: github.event.repository.private == false && always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      # A separate gate so the SARIF above is always uploaded, even when this
      # fails. An image people self-host should not ship known criticals.
      - name: Fail on critical or high findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: stoky:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ---------------------------------------------------------- image-publish --
  # The only job that waits for everything, and the only one that can ship.
  # It rebuilds the commit image-build just scanned — same context, same
  # Dockerfile — from the layer cache that build wrote moments ago, so this is
  # minutes of cache hits plus the push, not a second build. The same
  # two-build pattern the old single job already used.
  image-publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, test, e2e, audit, image-build]
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache-from only: image-build already exported these layers, and
      # re-exporting identical ones here would spend upload time saying
      # nothing new.
      - name: Push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha

      # Lets an operator verify the image they are about to self-host really
      # was built from this repository, by this workflow, from this commit.
      #
      # Public repositories only, like the SARIF upload in image-build and for
      # the same shape of reason: GitHub answers "Feature not available for
      # user-owned private repositories" after everything else has succeeded.
      # If this repository goes public, provenance starts attesting on its
      # own — which is also when it starts mattering, since it exists for
      # people who did not build the image themselves.
      - name: Attest provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
