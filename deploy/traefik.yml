# Descarga junto con docker-compose.yml; no necesita edición.
# Download beside docker-compose.yml; no editing required.
# File routing needs no Docker socket or container-discovery privileges.
# Traefik expands DOMAIN from the environment set by Compose.
http:
  routers:
    stoky:
      rule: 'Host(`{{ env "DOMAIN" }}`)'
      entryPoints: [websecure]
      service: stoky
      middlewares: [stoky-security]
      tls:
        certResolver: letsencrypt
  services:
    stoky:
      loadBalancer:
        servers:
          - url: http://app:3000
  middlewares:
    stoky-security:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        # Sin preload: inscribir el dominio en las listas de los navegadores
        # es decisión del dueño del dominio. / No preload: listing the domain
        # in browsers' built-in lists is the domain owner's decision.
        stsPreload: false
        contentTypeNosniff: true
        frameDeny: true
# TLS 1.2 or later; at 1.2, only forward-secret AEAD suites (Mozilla
# "intermediate"). Named `default`, it applies to every router. TLS 1.3 suites
# are not configurable in Go and are all AEAD already. No sniStrict: until ACME
# issues a certificate Traefik has only its default one, and sniStrict would turn
# that into a handshake failure. No curvePreferences: Go's own list negotiates
# the post-quantum X25519MLKEM768, and [X25519, CurveP256] fell back to X25519.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
