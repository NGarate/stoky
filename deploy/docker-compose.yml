# Stoky — instalación de la versión publicada / released-image installation.
# Download this file, traefik.yml and example.env from the SAME release;
# rename example.env to .env. Requires Docker Compose >= 2.23.1.
# See https://github.com/NGarate/stoky/blob/master/docs/INSTALL.md
# Separate from the source checkout's default development project (stoky).
name: stoky-release

# Every service writes its logs through this one block. Docker's default
# json-file driver never rotates (max-size is unlimited unless set), so without
# it the security log, which an unauthenticated client can add lines to, grows
# until the disk is full. The driver is named next to its options on purpose: a
# daemon-wide default such as journald rejects max-size and the container would
# refuse to start. About 50 MB per service; see docs/INSTALL.md to ship logs
# elsewhere or keep the daemon's own driver.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Each service also has a pids limit: the most processes and threads it may run
# at once, so a fork loop or a runaway thread pool stops at its own ceiling and
# does not use up the host's process table. The values are ceilings, not
# sizing: five to ten times the peak measured under load (SECURITY.md).
# There is deliberately no cpus limit: Docker refuses to start a container whose
# cpus value is higher than the host's core count, and small hosts are the
# common install.

# The service images are named by exact version and by the digest of the
# multi-platform index that version pointed to when the release was cut. A tag
# can be re-pushed and a digest cannot, so `docker compose pull` fetches what
# the release smoke ran on and not whatever the tag names that day. The tag is
# for readers; Docker resolves the digest. PostgreSQL, Valkey and Traefik fixes
# therefore arrive with a Stoky release (docs/RELEASING.md refreshes them).
services:
  db:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    environment:
      POSTGRES_USER: stoky
      POSTGRES_DB: stoky
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con openssl rand -hex 32}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stoky
    healthcheck:
      # Over TCP, not the default unix socket: on a new volume the entrypoint's
      # temporary init server listens on the socket only, so a socket probe
      # reports healthy, releases the app, and its migrations meet a refused
      # connection while the real server restarts.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U stoky -d stoky"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
    # Valkey does not read the container limit: without --maxmemory it grows
    # until the kernel kills it, and the sign-in limiter, which fails closed,
    # goes down with it. 160mb leaves the rest of the 256m for the copy-on-write
    # of a background save. allkeys-lru drops cold product-cache entries first;
    # a live rate-limit counter is touched on every attempt. Not noeviction (a
    # full cache refuses the limiter's writes: the same sign-in outage) and
    # not volatile-ttl (it evicts the short-lived counters first). Starts with
    # valkey-server so the image's entrypoint still drops root.
    command:
      [valkey-server, --maxmemory, 160mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - valkey_data:/data
    networks:
      - stoky
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Required, never defaulted: a default here is a second copy of the version
    # that nothing checks, and an .env without the line would silently pull it.
    image: "ghcr.io/ngarate/stoky:${STOKY_VERSION:?Define STOKY_VERSION en .env con la etiqueta exacta de esta versión}"
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512
    environment:
      NODE_ENV: production
      # One password configures BOTH services; hex avoids URL escaping issues.
      DATABASE_URL: "postgresql://stoky:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con openssl rand -hex 32}@db:5432/stoky?schema=public"
      VALKEY_URL: redis://cache:6379
      # The one address Traefik routes. A list in STOKY_URLS outside the bundle;
      # here a second entry would be trusted for sign-in and never reach us.
      STOKY_URLS: "https://${DOMAIN:?Define DOMAIN en .env sin https ni ruta}"
      # Passed through, not required here: the application refuses to start
      # without a usable secret and names the variable, and an .env from an
      # earlier release may still hold the old name. install.sh renames it.
      STOKY_SECRET: "${STOKY_SECRET:-}"
      # Legacy name, read only when STOKY_SECRET is empty, with a warning.
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-}"
      # Who may create an account: open | first-user | closed. Defaulted, unlike
      # the lines above: an .env from an earlier release lacks it, and the safe
      # value for that installation is the one that closes registration.
      STOKY_REGISTRATION: "${STOKY_REGISTRATION:-first-user}"
    volumes:
      - uploads:/app/uploads
    # Inherit the image's /api/health check and automatic startup migrations.
    networks:
      - stoky
      - traefik
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
    environment:
      DOMAIN: "${DOMAIN:?Define DOMAIN en .env sin https ni ruta}"
    command:
      - --api.dashboard=false
      # No calls to Traefik Labs. The version check is on by default and tells
      # them an instance runs at this address; Traefik is updated by a Stoky
      # release, which pins it, so its notice is one the operator cannot act on.
      # Usage statistics are already off; stated so a new default cannot change it.
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # A keep-alive connection that has gone quiet is closed after 60s instead
      # of Traefik's 180s, so held-open sockets free the 256m sooner; browsers
      # simply reconnect. readTimeout is its default, stated so it cannot drift:
      # it covers the whole request body, and a 10 MiB receipt (about 14 MB of
      # base64) needs about 1.9 Mbps of uplink to arrive within 60s. A per-address
      # connection cap is not possible here (inFlightConn is TCP-only, and an
      # HTTP chain refuses it); SECURITY.md sends it to the host firewall.
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=60s
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=60s
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Define ACME_EMAIL en .env}"
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.health.address=:8082
      - --ping=true
      - --ping.entrypoint=health
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    networks:
      - traefik
    healthcheck:
      test:
        [
          CMD,
          traefik,
          healthcheck,
          --ping,
          --ping.entrypoint=health,
          --entrypoints.health.address=:8082,
        ]
      interval: 10s
      timeout: 5s
      retries: 5

# A file source works with read_only containers; inline configs do not.
# Traefik reads DOMAIN from its environment through Go templating in this file.
configs:
  traefik_dynamic:
    file: ./traefik.yml

volumes:
  postgres_data:
  valkey_data:
  uploads:
  letsencrypt:

networks:
  stoky:
    internal: true
  traefik:
