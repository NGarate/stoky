#
# WARNING: To install Stoky, follow our guide: https://github.com/NGarate/stoky/blob/master/docs/INSTALL.md
#
# Make sure to use the docker-compose.yml and example.env of the same release,
# and rename example.env to .env. Requires Docker Compose 2.23.1+.
#
# Stoky serves plain HTTP on one port. TLS is your reverse proxy's: the guide's
# "Your proxy" section has an example for Traefik, Caddy, nginx and Tailscale.
#

name: stoky-release

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: ghcr.io/ngarate/stoky/postgres:18.6-alpine@sha256:be7de460cf6d97c68e156f1b0bf7773748fe5e32a3fb0eb94b9a8b7c60e64d66
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # The image's postgres user (70 on Alpine), so the entrypoint never runs
    # as root and never steps down through gosu: no capability is needed.
    user: "70:70"
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    environment:
      POSTGRES_USER: stoky
      POSTGRES_DB: stoky
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con openssl rand -hex 32}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - stoky
    healthcheck:
      # TCP, not the socket: the init server listens on the socket only.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U stoky -d stoky"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
    command:
      [valkey-server, --maxmemory, 160mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - valkey_data:/data
    networks:
      - stoky
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: "ghcr.io/ngarate/stoky:${STOKY_VERSION:?Define STOKY_VERSION en .env con la etiqueta exacta de esta versión}"
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      resources:
        limits:
          # Three Tesseract workers of about 120 MB each, the preparation
          # thread's images of up to 20 megapixels and the server itself.
          memory: 2g
          pids: 512
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://stoky:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con openssl rand -hex 32}@db:5432/stoky?schema=public"
      VALKEY_URL: redis://cache:6379
      STOKY_URLS: "https://${DOMAIN:?Define DOMAIN en .env sin https ni ruta}"
      STOKY_SECRET: "${STOKY_SECRET:-}"
      STOKY_REGISTRATION: "${STOKY_REGISTRATION:-first-user}"
      # Whose X-Forwarded-* headers count: your proxy's address. Nobody's
      # until you set it.
      STOKY_TRUSTED_PROXIES: "${STOKY_TRUSTED_PROXIES:-}"
      OCR_WORKERS: "${OCR_WORKERS:-3}"
    # The only published port in this file. Plain HTTP, for your proxy.
    ports:
      - "${STOKY_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    networks:
      - stoky
      - web
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  uploads:

networks:
  stoky:
    internal: true
  # Docker publishes no port for a container that is only on an internal
  # network. The app is on this one too; the database and the cache are not.
  web:
