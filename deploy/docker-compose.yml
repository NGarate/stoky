#
# WARNING: To install Stoky, follow our guide: https://github.com/NGarate/stoky/blob/master/docs/INSTALL.md
#
# Make sure to use the docker-compose.yml, traefik.yml and example.env of the
# same release, and rename example.env to .env. Requires Docker Compose 2.23.1+.
#

name: stoky-release

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: ghcr.io/ngarate/stoky/postgres:18.6-alpine@sha256:be7de460cf6d97c68e156f1b0bf7773748fe5e32a3fb0eb94b9a8b7c60e64d66
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # The image's postgres user (70 on Alpine), so the entrypoint never runs
    # as root and never steps down through gosu: no capability is needed.
    user: "70:70"
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    environment:
      POSTGRES_USER: stoky
      POSTGRES_DB: stoky
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con openssl rand -hex 32}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - stoky
    healthcheck:
      # TCP, not the socket: the init server listens on the socket only.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U stoky -d stoky"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
    command:
      [valkey-server, --maxmemory, 160mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - valkey_data:/data
    networks:
      - stoky
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: "ghcr.io/ngarate/stoky:${STOKY_VERSION:?Define STOKY_VERSION en .env con la etiqueta exacta de esta versión}"
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      resources:
        limits:
          # Three Tesseract workers of about 120 MB each, the preparation
          # thread's images of up to 20 megapixels and the server itself.
          memory: 2g
          pids: 512
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://stoky:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env con openssl rand -hex 32}@db:5432/stoky?schema=public"
      VALKEY_URL: redis://cache:6379
      STOKY_URLS: "https://${DOMAIN:?Define DOMAIN en .env sin https ni ruta}"
      STOKY_SECRET: "${STOKY_SECRET:-}"
      STOKY_REGISTRATION: "${STOKY_REGISTRATION:-first-user}"
      # Whose X-Forwarded-For counts: Traefik's network, below, and nobody else.
      STOKY_TRUSTED_PROXIES: "${STOKY_TRUSTED_PROXIES:-10.153.74.0/24}"
      OCR_WORKERS: "${OCR_WORKERS:-3}"
    volumes:
      - uploads:/app/uploads
    networks:
      - stoky
      - traefik
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  traefik:
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 128
    environment:
      DOMAIN: "${DOMAIN:?Define DOMAIN en .env sin https ni ruta}"
    command:
      - --api.dashboard=false
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=60s
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=60s
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=60s
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Define ACME_EMAIL en .env}"
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.health.address=:8082
      - --ping=true
      - --ping.entrypoint=health
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    networks:
      - traefik
    healthcheck:
      test:
        [
          CMD,
          traefik,
          healthcheck,
          --ping,
          --ping.entrypoint=health,
          --entrypoints.health.address=:8082,
        ]
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  traefik_dynamic:
    file: ./traefik.yml

volumes:
  postgres_data:
  valkey_data:
  uploads:
  letsencrypt:

networks:
  stoky:
    internal: true
  traefik:
    # A fixed range, so that the app can be told which peers are Traefik.
    ipam:
      config:
        - subnet: 10.153.74.0/24
