# Bun reads this file for `bun install`, `bun add`, `bun update` and
# `bun remove`, and also for `bun run` and `bun test`. `[install]` and `[test]`
# are set.

[install]
# Refuse any package version published less than three days ago, direct or
# transitive. A hijacked npm release is often found and pulled within hours or
# a day or two; a lockfile refresh run during that window would lock one
# in with every gate green, because `bun audit` only knows published
# advisories. Applies only when Bun resolves something new: a
# `--frozen-lockfile` install (CI, the Dockerfile, scripts/dev-local.sh)
# installs exactly what bun.lock names, whatever its age.
#
# A security fix younger than three days: `bun audit fix` installs it anyway
# and marks the row "(newer than --minimum-release-age)", or pass
# `--minimum-release-age 0` to that one command. Do not lower this value or
# add a permanent entry to `minimumReleaseAgeExcludes` for it. SECURITY.md,
# "Supply chain", has the reasoning; package-overrides.test.ts holds the value.
minimumReleaseAge = 259200 # seconds: 3 days

[test]
# Installs globalThis.AsyncLocalStorage before any of Next's server modules is
# evaluated, as `next start` does. Without it, whichever test file imported
# `next/headers` first left Next's request storage broken for the rest of the
# process (ISSUES TEST-11). Applies to every `bun test`, including a single
# file run alone; a suite's own `--preload` adds to it.
preload = ["./src/__tests__/setup/next-environment.ts"]

[fmt]
# `bun fmt` is Bun's port of Prettier, and these are Prettier's options under
# Prettier's names. Only the width is stated: the rest of Prettier's defaults
# (double quotes, semicolons, trailing commas, two spaces) are what the code
# was already written in. `.prettierignore` says what is left alone, and
# `bun run check:format` is the gate.
printWidth = 80
