services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stoky
      POSTGRES_PASSWORD: stoky_dev_password
      POSTGRES_DB: stoky
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stoky -d stoky"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Identical to docker-compose.dev.yml's `db` and `cache`, ports included.
    # Both files are project `stoky`, so a definition that differs makes each
    # `up` recreate the other's containers: the host's integration suite would
    # move `db` off this network and strand the app container. Loopback ports
    # also let the host's `verify:ci` reach the same two services.
    # src/__tests__/unit/compose-dev.test.ts holds the two in step.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - stoky

  cache:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - stoky

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://stoky:stoky_dev_password@db:5432/stoky?schema=public
      - VALKEY_URL=redis://cache:6379
    volumes:
      - .:/app
      - /app/node_modules
      # The Prisma client the image generated, kept over the mounted checkout
      # as node_modules is (src/__tests__/unit/prisma-client-output.test.ts).
      - /app/src/generated
      - uploads:/app/uploads
    # Loopback only, like the services in docker-compose.dev.yml. Reaching the
    # dev server from a phone goes through `tailscale serve` (see
    # DEV_ALLOWED_ORIGIN in .env.example), which also proxies to localhost.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - stoky
    command: bun run dev

volumes:
  postgres_data:
  valkey_data:
  uploads:

networks:
  stoky:
    driver: bridge
