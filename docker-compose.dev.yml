# docker-compose.dev.yml -- Infrastructure services for local development
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Runs PostgreSQL and Valkey with ports exposed to localhost so the
# Next.js app (running natively on the host) can connect via localhost.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stoky
      POSTGRES_PASSWORD: stoky_dev_password
      POSTGRES_DB: stoky
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoky -d stoky"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
