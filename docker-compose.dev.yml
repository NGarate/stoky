# docker-compose.dev.yml -- Infrastructure services for local development
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Runs PostgreSQL and Valkey with ports exposed to localhost so the
# Next.js app (running natively on the host) can connect via localhost.
#
# Bound to 127.0.0.1, not to every interface: the password is published in
# this file, Postgres's superuser can run programs in the container, Valkey has
# no authentication, and Docker's published ports bypass host firewalls such
# as ufw. On a shared network a bare "5432:5432" is all three, open.
#
# `db` and `cache` are defined exactly as in docker-compose.yml, network
# included: both files are project `stoky`, and any difference makes one
# file's `up` recreate the other's containers.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stoky
      POSTGRES_PASSWORD: stoky_dev_password
      POSTGRES_DB: stoky
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - stoky
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stoky -d stoky"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - stoky
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_data:

networks:
  stoky:
    driver: bridge
